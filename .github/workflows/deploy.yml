name: Deploy Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          cd student_profile_application
          flutter pub get

      # - name: Run Tests
      #   run: |
      #     cd student_profile_application
      #     flutter test

      - name: Build Android APK
        run: |
          cd student_profile_application
          flutter build apk --release
